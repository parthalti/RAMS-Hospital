name: RAMS-Hospital CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rams_test
          POSTGRES_PASSWORD: rams_test_password
          POSTGRES_DB: rams_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rams_test -d rams_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://rams_test:rams_test_password@localhost:5432/rams_test?schema=public
      JWT_SECRET: ci-only-not-for-production-change-me
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Apply non-breaking backend security updates
        run: npm audit fix || true
      - name: Emit updated backend lockfile for repository update
        run: node -e "const fs=require('fs');const s=JSON.stringify(JSON.parse(fs.readFileSync('package-lock.json','utf8')));for(let i=0;i<s.length;i+=30000)console.log('LOCKFILE_CHUNK:'+Math.floor(i/30000)+':'+s.slice(i,i+30000))"
      - name: Upload updated backend lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: backend-security-lockfile
          path: backend/package-lock.json
      - name: Audit backend dependencies
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Apply migrations to disposable CI database
        run: npx prisma migrate deploy
      - name: Build backend
        run: npm run build
      - name: Run Jest tests
        run: npm test -- --runInBand
      - name: Smoke test backend HTTP health endpoint
        run: |
          npm start > /tmp/rams-backend.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --connect-timeout 1 --max-time 2 --fail --silent --show-error http://127.0.0.1:4000/health > /tmp/rams-health.json; then
              grep -q '"success":true' /tmp/rams-health.json
              cat /tmp/rams-health.json
              exit 0
            fi
            sleep 2
          done
          cat /tmp/rams-backend.log
          exit 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Apply non-breaking frontend security updates
        run: npm audit fix || true
      - name: Emit updated frontend lockfile for repository update
        run: node -e "const fs=require('fs');const s=JSON.stringify(JSON.parse(fs.readFileSync('package-lock.json','utf8')));for(let i=0;i<s.length;i+=30000)console.log('LOCKFILE_CHUNK:'+Math.floor(i/30000)+':'+s.slice(i,i+30000))"
      - name: Upload updated frontend lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: frontend-security-lockfile
          path: frontend/package-lock.json
      - name: Audit frontend dependencies
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Type-check frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build
      - name: Smoke test frontend preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/rams-frontend.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ > /tmp/rams-index.html; then
              grep -qi '<!doctype html' /tmp/rams-index.html
              echo "Frontend preview served the built application successfully."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/rams-frontend.log
          exit 1

  secret-scan:
    name: Scan full Git history for secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository and Git history with Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
